<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="830" viewBox="0 0 1180 830" role="img" aria-labelledby="title desc">
<title id="title">Clip orientation and Pi 5 physical header reference</title><desc id="desc">Conditional eight-lead flash top view: 1 to 4 down the left, 5 to 8 up the right. Pi physical pins 17 supply, 19 MOSI, 21 MISO, 23 CLK, 24 CE0, 25 ground. This is not verified board wiring.</desc>
