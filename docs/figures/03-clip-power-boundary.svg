<title id="figure-title">Clip and power boundary — NOT a pinout</title><desc id="figure-description">Conceptual power boundary, not an identified pinout or permission to supply power. Solid arrows show the stated sequence or relationship; dashed arrows are conditional or unconfirmed. Programmer: disconnected during wiring; Clip: exact contacts unresolved; Still-soldered QSPI; Shared SOM rails / SoC / bus; Printer and peripherals physically unplugged; STOP: unexplained power, heat or contention.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(14.4 445.85)">
