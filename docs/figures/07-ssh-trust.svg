<title id="figure-title">Independent owner SSH authority</title><desc id="figure-description">Owner SSH trust design; first enrollment requires an independently isolated sole-peer link. Solid arrows show the stated sequence or relationship; dashed arrows are conditional or unconfirmed. New owner client private key LAPTOP only; Owner public authorized key; Separate sshd :2222 password auth off; StrictModes on; Separate owner SSH host identity; Isolated first-use enrollment; retain host fingerprint for later continuity; Vendor CA / host identities preserved.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(14.4 278.85)">
