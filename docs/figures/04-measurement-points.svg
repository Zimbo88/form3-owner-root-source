<title id="figure-title">Measurement relationships — contacts must first be identified</title><desc id="figure-description">Conceptual measurement points. Physical contacts and supply suffix remain identification gates. Solid arrows show the stated sequence or relationship; dashed arrows are conditional or unconfirmed. G: confirmed board ground (not assumed shield); V: confirmed flash supply contact (unresolved); C1..Cn: individually identified clip contacts; P: disconnected programmer supply and ground; Meter: resistance only unpowered; DC voltage for voltage; STOP until actual G/V/clip orientation is established.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(14.4 320.85)">
