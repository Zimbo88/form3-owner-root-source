<title id="figure-title">Stock factory network boot candidate</title><desc id="figure-description">Unconfirmed stock network-boot candidate; not an executable stock-root recipe. Solid arrows show the stated sequence or relationship; dashed arrows are conditional or unconfirmed. Physical trigger: unresolved GPIO 61 is NOT connector pin 61; Unchanged factory U-Boot branch; Isolated DHCP service segment; TFTP genuine kernel + DTB; 192.168.1.1:/srv/nfs explicit NFS-root semantics; Reviewed minimal init; RAM runtime writes; eMMC read-only; no vendor startup.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(14.4 589.25)">
