<title id="figure-title">Panel privilege boundary</title><desc id="figure-description">Current source privilege design, including the explicit narrow Clear reset broker. No generic root proxy. Solid arrows show the stated sequence or relationship; dashed arrows are conditional or unconfirmed. Nonblocking owner SysV supervisor; Narrow root socket launcher; Bind physical interface; drop groups/UID/GID; Unprivileged owner panel :1328; Owner browser; explicit LAN login policy; Allowlisted proc/sys + reviewed private summaries; Owner settings; bounded atomic state; Root local UNIX-socket broker.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(14.4 414.6)">
